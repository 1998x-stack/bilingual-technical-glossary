name: Validate glossary corpus
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'glossaries/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify.py
      - run: python -m unittest discover -s tests -v
