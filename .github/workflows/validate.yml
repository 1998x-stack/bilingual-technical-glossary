name: Validate glossary corpus
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Check website JavaScript syntax
        run: node --check site/app.js
      - name: Verify corpus, mirrors, and metadata
        run: python scripts/verify.py
      - name: Verify AI Infra Wiki
        run: python scripts/verify_wiki.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
