name: Validate glossary corpus
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Validate portable Agent Skills
        run: python scripts/sync_agent_skills.py --check
      - name: Check website JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/term.js
          node --check docs/app.js
          node --check docs/term.js
      - name: Verify algorithms glossary source and PDF mirrors
        run: node scripts/render_algorithms.mjs --check
      - name: Verify Distributed Systems source and publication mirrors
        run: node scripts/render_distributed_systems.mjs --check
      - name: Verify Optimization Theory publication and source mirrors
        run: node scripts/render_optimization_theory.mjs --check
      - name: Verify Mathematical Statistics source, PDF and mirrored publications
        run: node scripts/render_mathematical_statistics.mjs --check
      - name: Verify RAG glossary source, PDF and Markdown mirrors
        run: node scripts/render_rag.mjs --check
      - name: Verify CUDA chapter sources and generated publication mirrors
        run: node scripts/render_cuda.mjs --check
      - name: Verify Database Systems sources and publication mirrors
        run: node scripts/render_database_systems.mjs --check
      - name: Verify NLP source terms, PDF and Markdown mirrors
        run: node scripts/render_nlp.mjs --check
      - name: Verify Computer Vision source and publication mirrors
        run: node scripts/render_computer_vision.mjs --check
      - name: Verify Computer Graphics source and publication mirrors
        run: node scripts/render_computer_graphics.mjs --check
      - name: Verify Robotics source and synchronized publications
        run: node scripts/render_robotics.mjs --check
      - name: Verify Autonomous Driving source and publication mirrors
        run: node scripts/render_autonomous_driving.mjs --check
      - name: Verify corpus, mirrors, and metadata
        run: python scripts/verify.py
      - name: Verify AI Infra Wiki
        run: |
          python scripts/build_wiki_index.py --check
          python scripts/verify_wiki.py
      - name: Verify AI Agents Wiki
        run: python scripts/verify_ai_agents_wiki.py
      - name: Validate documentation and local links
        run: python scripts/verify_docs.py
      - name: Enforce read-only workflows and reviewer evidence
        run: |
          python scripts/verify_workflow_policy.py
          python scripts/verify_wiki_reviews.py --check --report
      - name: Upload human-review evidence inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-evidence-audit-${{ github.sha }}
          path: wiki-evidence-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
