# P0 safety: synchronization produces a reviewable patch, never a bot commit.
name: Propose Data Structures index changes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_data_structures.py'
      - 'glossaries/data-structures.md'
      - '.github/workflows/sync-data-structures.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: propose-data-structures-${{ github.ref }}
  cancel-in-progress: true
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate isolated proposed changes
        run: |
          set -euo pipefail
          python scripts/sync_data_structures.py
          git add -N .
          git diff --binary > proposed-data-structures.patch
          if test -s proposed-data-structures.patch; then
            echo "Proposed changes require a reviewable PR; nothing was committed or pushed."
            git diff --stat
          else
            echo "No proposed changes."
          fi
      - name: Upload suggested diff
        uses: actions/upload-artifact@v4
        with:
          name: data-structures-proposal-${{ github.sha }}
          path: proposed-data-structures.patch
          retention-days: 14
