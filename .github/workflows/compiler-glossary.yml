name: Build Compiler Principles Glossary

on:
  push:
    branches: [main]
    paths:
      - 'data/compiler-principles.tsv'
      - 'scripts/compiler_pdf.py'
      - 'scripts/build.py'
      - '.github/workflows/compiler-glossary.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compiler-glossary-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install CJK font and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-arphic-gbsn00lp
          python3 -m pip install -r requirements.txt
      - name: Rebuild sources, Markdown, PDF, and search index
        run: |
          python3 scripts/build.py
          python3 scripts/verify.py
          python3 -m unittest discover -s tests -v
          python3 - <<'PY'
          from pathlib import Path
          pdf = Path('pdf/compiler-principles.pdf')
          assert pdf.read_bytes().startswith(b'%PDF-')
          assert pdf.stat().st_size > 10000
          assert (Path('docs/pdf') / pdf.name).read_bytes() == pdf.read_bytes()
          print(f'Compiler Principles PDF ready: {pdf.stat().st_size:,} bytes')
          PY
      - name: Commit generated source exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/terms.json data/terms.csv docs/data/terms.json docs/data/catalog.json
          git add glossaries/compiler-principles.md pdf/compiler-principles.pdf
          git add docs/glossaries/compiler-principles.md docs/pdf/compiler-principles.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(compiler): publish 268-term Markdown PDF and Pages index"
            if ! git push origin HEAD:main; then
              git stash push --include-untracked -m "uncommitted regenerated files"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          else
            echo "Generated artifacts already up to date."
          fi
