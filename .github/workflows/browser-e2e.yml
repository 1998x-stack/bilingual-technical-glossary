name: Browser E2E (Chromium, desktop and mobile)
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'e2e/**'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright + Chromium system packages
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Run actual browser tests
        run: python -m unittest discover -s e2e -v
      - name: Upload screenshots from real Chromium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-e2e-${{ github.sha }}
          path: e2e-artifacts/
          retention-days: 14
          if-no-files-found: ignore
