# P0 safety: synchronization produces a reviewable patch, never a bot commit.
name: Propose Machine Learning index changes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/import_machine_learning.py'
      - 'sources/machine-learning.md'
      - '.github/workflows/sync-machine-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: propose-machine-learning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate isolated proposed changes
        run: |
          set -euo pipefail
          python scripts/import_machine_learning.py
          git add -N .
          git diff --binary > proposed-machine-learning.patch
          if test -s proposed-machine-learning.patch; then
            echo "Proposed changes require a reviewable PR; nothing was committed or pushed."
            git diff --stat
          else
            echo "No proposed changes."
          fi
      - name: Upload suggested diff
        uses: actions/upload-artifact@v4
        with:
          name: machine-learning-proposal-${{ github.sha }}
          path: proposed-machine-learning.patch
          retention-days: 14
