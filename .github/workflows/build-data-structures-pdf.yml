# P0 safety: render one domain only. This workflow NEVER pushes to main.
# To publish, download the artifact, review source/output changes in a PR.
name: Render Data Structures PDF (artifact only)
on:
  push:
    branches: [main]
    paths:
      - 'sources/data-structures.html'
      - 'sources/data-structures.html'
      - '.github/workflows/build-data-structures-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-data-structures-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install domain-specific renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core libpango-1.0-0 libcairo2
          python -m pip install 'weasyprint==68.0' 'pypdf>=5,<7'
      - name: Render data-structures only
        run: |
          set -euo pipefail
          mkdir -p pdf docs/pdf
          python -m weasyprint sources/data-structures.html pdf/data-structures.pdf
          cp pdf/data-structures.pdf docs/pdf/data-structures.pdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          original=Path('pdf/data-structures.pdf')
          mirrored=Path('docs/pdf/data-structures.pdf')
          raw=original.read_bytes()
          assert raw.startswith(b'%PDF-') and len(raw)>10000, original
          assert raw==mirrored.read_bytes(), 'Publication mirror mismatch'
          pdf=PdfReader(str(original))
          assert len(pdf.pages)>0, 'Empty document'
          content=''.join((page.extract_text() or '') for page in pdf.pages)
          assert len(content)>150, 'PDF text extraction unexpectedly empty'
          print('Checked data-structures:',len(pdf.pages),'pages',len(raw),'bytes')
          PY
      - name: Upload reviewable publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: data-structures-pdf-${{ github.sha }}
          path: |
            pdf/data-structures.pdf
            docs/pdf/data-structures.pdf
          if-no-files-found: error
          retention-days: 14
