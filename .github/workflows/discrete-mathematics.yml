# P0 safety: render one domain only. This workflow NEVER pushes to main.
# To publish, download the artifact, review source/output changes in a PR.
name: Render Discrete Mathematics PDF (artifact only)
on:
  push:
    branches: [main]
    paths:
      - 'data/discrete-mathematics.tsv'
      - 'scripts/render_discrete_mathematics_pdf.py'
      - '.github/workflows/discrete-mathematics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-discrete-mathematics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install domain-specific renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gbsn00lp
          python -m pip install 'reportlab>=4,<5' 'pypdf>=5,<7'
      - name: Render discrete-mathematics only
        run: |
          set -euo pipefail
          mkdir -p pdf docs/pdf
          python scripts/render_discrete_mathematics_pdf.py
          cp pdf/discrete-mathematics.pdf docs/pdf/discrete-mathematics.pdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          original=Path('pdf/discrete-mathematics.pdf')
          mirrored=Path('docs/pdf/discrete-mathematics.pdf')
          raw=original.read_bytes()
          assert raw.startswith(b'%PDF-') and len(raw)>10000, original
          assert raw==mirrored.read_bytes(), 'Publication mirror mismatch'
          pdf=PdfReader(str(original))
          assert len(pdf.pages)>0, 'Empty document'
          content=''.join((page.extract_text() or '') for page in pdf.pages)
          assert len(content)>150, 'PDF text extraction unexpectedly empty'
          print('Checked discrete-mathematics:',len(pdf.pages),'pages',len(raw),'bytes')
          PY
      - name: Upload reviewable publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discrete-mathematics-pdf-${{ github.sha }}
          path: |
            pdf/discrete-mathematics.pdf
            docs/pdf/discrete-mathematics.pdf
          if-no-files-found: error
          retention-days: 14
