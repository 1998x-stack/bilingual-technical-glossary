name: Build Operating Systems PDF
on:
  push:
    branches:
      - main
      - feat/operating-systems-glossary-20261116
    paths:
      - 'assets/source/operating-systems.html'
      - 'glossaries/operating-systems.md'
      - 'scripts/build_os_pdf.py'
      - 'tests/test_catalog.py'
      - '.github/workflows/build-os-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-operating-systems-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Chinese fonts and WeasyPrint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
          python3 -m pip install 'weasyprint==68.0'
      - name: Render the authored OS handbook
        run: python3 scripts/build_os_pdf.py
      - name: Verify data and exports
        run: |
          python3 scripts/verify.py
          python3 -m unittest discover -s tests -v
      - name: Commit the PDF and Pages copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/operating-systems.pdf docs/pdf/operating-systems.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(pdf): publish Operating Systems handbook [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
