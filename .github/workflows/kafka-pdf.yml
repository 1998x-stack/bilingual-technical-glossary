name: Build Kafka glossary PDF
on:
  push:
    branches: [main]
    paths:
      - 'glossaries/apache-kafka.md'
      - 'scripts/render_kafka_pdf.py'
      - '.github/workflows/kafka-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies and Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gbsn00lp
          python -m pip install -r requirements.txt
      - name: Build indexed Kafka PDF
        run: |
          python scripts/render_kafka_pdf.py
          mkdir -p docs/pdf
          cp pdf/apache-kafka.pdf docs/pdf/apache-kafka.pdf
          test -s pdf/apache-kafka.pdf
          cmp -s pdf/apache-kafka.pdf docs/pdf/apache-kafka.pdf
      - name: Commit both downloadable PDF copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/apache-kafka.pdf docs/pdf/apache-kafka.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(kafka): publish searchable Kafka PDF handbook"
            git push
          fi
