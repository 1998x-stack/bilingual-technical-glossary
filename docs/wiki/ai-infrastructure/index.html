<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>TERM/ATLAS · 术语检索</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101b31;color:#eaf1fa}
main{padding:30px;max-width:520px}a{color:#a5baf9}h1{font-size:24px;line-height:1.35}
</style>
</head>
<body>
<main>
<h1>专业术语详情已整合至 TERM/ATLAS</h1>
<p>所有术语统一从检索页进入；现有深度讲解可在对应术语详情中阅读。</p>
<p><a id="continue" href="../../index.html?category=ai-infrastructure#explorer">进入术语检索</a></p>
</main>
<script>
'use strict';
(async () => {
  const fallback = '../../index.html?category=ai-infrastructure#explorer';
  const id = Number(new URLSearchParams(location.search).get('term'));
  if (!Number.isInteger(id) || id < 1) { location.replace(fallback); return; }
  try {
    const [manifestResponse, termsResponse] = await Promise.all([
      fetch('./manifest.json'), fetch('../../data/terms.json')
    ]);
    if (!manifestResponse.ok || !termsResponse.ok) throw Error('Index unavailable');
    const manifest = await manifestResponse.json();
    const entries = await termsResponse.json();
    const item = manifest.terms.find(t => t.n === id && t.ready);
    const match = item && entries.find(t => t.category === 'ai-infrastructure' && t.en === item.en && t.zh === item.zh && t.topic === item.topic);
    if (!match) { location.replace(fallback); return; }
    const params = new URLSearchParams({ category: match.category, chapter: String(match.chapter), en: match.en, zh: match.zh });
    location.replace('../../term.html?' + params.toString());
  } catch (_) {
    document.getElementById('continue').focus();
  }
})();
</script>
</body>
</html>
